---
name: dev-oremi-akorin

services:
  isakoso:
    image: demsking/oremi-isakoso
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - 35089:5089
    environment:
      OREMI_ISAKOSO_MQTT_BROKER: mosquitto

  isinmi:
    image: demsking/oremi-isinmi
    restart: unless-stopped
    ports:
      - 35073:5073
    environment:
      OREMI_ISINMI_DATABASE_ENCRYPTION_KEY: B0JJTY+h9x1u36hFuD0UqakgN0P//DWk+r+3+nY3JFo=
    volumes:
      - ~/.local/share/oremi-isinmi:/oremi/data

  ojo:
    image: demsking/oremi-ojo
    restart: unless-stopped
    ports:
      - 35040:5040

  rediyo:
    image: demsking/oremi-rediyo
    restart: unless-stopped
    ports:
      - "35076:5076"

  kansa:
    image: demsking/oremi-kansa
    restart: unless-stopped
    ports:
      - "35046:5046"
    volumes:
      - ~/.local/share/oremi-kansa:/oremi/data

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: unless-stopped
    ports:
      - 31883:1883
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  ollama:
    tty: true
    image: ollama/ollama
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - ~/.ollama:/root/.ollama
    ports:
      - 31434:11434
    environment:
      CUDA_VISIBLE_DEVICES: 0
...
