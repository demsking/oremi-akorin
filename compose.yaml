---
name: dev-oremi-akorin

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: always
    ports:
      - 31883:1883
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  ollama:
    tty: true
    image: ollama/ollama
    restart: always
    runtime: nvidia
    volumes:
      - ~/.ollama:/root/.ollama
    ports:
      - 31434:11434
    environment:
      CUDA_VISIBLE_DEVICES: 0

  isinmi:
    image: demsking/oremi-isinmi-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 37337:7337
    environment:
      OREMI_ISINMI_OLLAMA_BASE_URL: http://ollama:11434
      OREMI_ISINMI_DATABASE_ENCRYPTION_KEY: B0JJTY+h9x1u36hFuD0UqakgN0P//DWk+r+3+nY3JFo=
    volumes:
      - ~/.config/oremi-isinmi-agent:/oremi/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7337/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  ojo:
    image: demsking/oremi-ojo
    restart: always
    depends_on:
      - ollama
    ports:
      - 31777:1777
    environment:
      OREMI_OJO_OLLAMA_BASE_URL: http://ollama:11434

  rediyo:
    image: demsking/oremi-rediyo-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 39170:9170
    volumes:
      - ~/.config/oremi-rediyo-agent:/var/cache/oremi-rediyo-agent
    environment:
      OLLAMA_BASEURL: http://ollama:11434

  kansa:
    image: demsking/oremi-kansa-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 34940:4940
    volumes:
      - ~/.config/oremi-kansa-agent:/var/cache/oremi-kansa-agent
    environment:
      OLLAMA_BASEURL: http://ollama:11434
...
