---
name: dev-oremi-akorin

services:
  devcontainer:
    build:
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: always
    ports:
      - 31883:1883
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  ollama:
    tty: true
    image: ollama/ollama
    restart: always
    runtime: nvidia
    volumes:
      - ~/.ollama:/root/.ollama
    ports:
      - 31434:11434
    environment:
      CUDA_VISIBLE_DEVICES: 0

  isinmi:
    image: demsking/oremi-isinmi-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 37337:7337
    environment:
      LOG_LEVEL: 'DEBUG'
      OLLAMA_BASEURL: http://ollama:11434
      OLLAMA_MODEL: $OLLAMA_MODEL
    volumes:
      - ./volumes/isinmi:/var/config/oremi-isinmi-agent

  weather:
    image: demsking/oremi-weather-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 31777:1777
    environment:
      LOG_LEVEL: 'DEBUG'
      OLLAMA_BASEURL: http://ollama:11434
      OLLAMA_MODEL: $OLLAMA_MODEL

  rediyo:
    image: demsking/oremi-rediyo-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 39170:9170
    volumes:
      - ~/.config/oremi-rediyo-agent:/var/cache/oremi-rediyo-agent
    environment:
      LOG_LEVEL: 'DEBUG'
      OLLAMA_BASEURL: http://ollama:11434
      OLLAMA_MODEL: $OLLAMA_MODEL

  kansa:
    image: demsking/oremi-kansa-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 34940:4940
    volumes:
      - ~/.config/oremi-kansa-agent:/var/cache/oremi-kansa-agent
    environment:
      LOG_LEVEL: 'DEBUG'
      OLLAMA_BASEURL: http://ollama:11434
      OLLAMA_MODEL: $OLLAMA_MODEL
...
