<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="The hardware and firmware companion for the Oremi personal assistant ecosystem. Manages device provisioning, sensor data collection, local processing, and communication with Oremi Andika STT module and other Oremi core services."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Oremi Akọrin Documentation</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      void (async () => {
        const response1 = await fetch('http://localhost:5020/openapi.json');
        const openapi = await response1.json();

        const response2 = await fetch('/DOCUMENTATION.md');
        const content = await response2.text();

        openapi.info.description = content;

        Scalar.createApiReference('#app', {
          title: 'Oremi Akọrin Documentation',
          agent: {
            disabled: true,
          },
          content: openapi,
          hideClientButton: true,
          hideTestRequestButton: true,
          expandAllModelSections: false,
          showSidebar: true,
          showDeveloperTools: 'localhost',
          operationTitleSource: 'summary',
          theme: 'default',
          persistAuth: false,
          telemetry: false,
          layout: 'modern',
          isEditable: false,
          isLoading: false,
          hideModels: false,
          documentDownloadType: 'both',
          hideSearch: false,
          showOperationId: false,
          hideDarkModeToggle: false,
          withDefaultFonts: true,
          defaultOpenAllTags: false,
          expandAllResponses: false,
          orderSchemaPropertiesBy: 'alpha',
          orderRequiredPropertiesFirst: true,
          default: false,
        });
      })();
    </script>
  </body>
</html>
